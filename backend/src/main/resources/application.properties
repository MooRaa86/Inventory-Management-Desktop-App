spring.application.name=CompanyInventory

server.address=127.0.0.1
server.port=${INVENTORY_PORT:8475}
server.shutdown=graceful

app.root=${APP_ROOT:.}
app.database-file=${app.root}/data/inventory.db

spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${app.database-file}?journal_mode=WAL&busy_timeout=15000&foreign_keys=true&synchronous=FULL&transaction_mode=IMMEDIATE
spring.datasource.hikari.pool-name=inventory-sqlite
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=15000
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

# Flyway is the single source of truth for the schema.
# Hibernate strict validation is disabled because SQLite reports INTEGER for
# all integral columns, which breaks BIGINT expectations; SchemaVerifier
# performs equivalent guarantees instead (checksums + integrity + tables).
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

app.security.jwt-secret-change-me=
app.admin.username=admin
app.admin.password=admin@omar.com
app.admin.email=admin@localhost.local
app.security.session-timeout-minutes=30
app.backup.enabled=true
app.backup.time=02:00
app.backup.retention-count=30
app.backup.verification=true

# Allow suspending the pool so backup/restore can safely swap the SQLite file
spring.datasource.hikari.allow-pool-suspension=true
